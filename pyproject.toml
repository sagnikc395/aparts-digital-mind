[project]
name = "aparts-digital-mind"
version = "0.1.0"
description = "The alignment tax of introspection: partial refusal-direction ablation as a dose-response dial"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
judge = ["anthropic>=0.40.0"]
lens = ["transformer-lens>=2.0.0"]

[project.scripts]
alignment-tax = "alignment_tax.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alignment_tax"]

[tool.uv]
package = true
